name: Telegram files

# Posts a release's files (Android, Windows, macOS, Linux) to the bot's store channel and registers them,
# so @v2fallbot's "Get the latest version" sends the new files. Files over 50 MB need Telegram's own
# Bot API server run locally (github.com/tdlib/telegram-bot-api, up to 2000 MB): the bot logs out of
# the cloud Bot API, uploads through the local one, and goes back to the cloud. Telegram lets a bot
# log back in to the cloud only 10 minutes after logOut, so the bot is quiet for about 10-15 minutes;
# updates sent to it meanwhile wait and are answered afterwards.
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_ADMIN_ID (already used by cloudflare.yml), TG_API_ID and
# TG_API_HASH (my.telegram.org → API development tools; an app id, no access to any chat).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "version (empty = the one in latest.json)"
        default: ""
      test:
        description: "test: send only the Windows file to the admin's chat, register nothing"
        type: boolean
        default: true

concurrency: { group: tg-files, cancel-in-progress: false }

jobs:
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN: ${{ secrets.TELEGRAM_ADMIN_ID }}
      API_ID: ${{ secrets.TG_API_ID }}
      API_HASH: ${{ secrets.TG_API_HASH }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      TEST: ${{ inputs.test }}
      DOMAIN: dl.v2fall.com
      KV_TITLE: v2fall-codes
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: latest.json }
      - name: Secrets present
        run: |
          ok=1; for k in TOKEN ADMIN API_ID API_HASH CF_TOKEN CF_ACCOUNT; do if [ -n "${!k}" ]; then echo "$k: set"; else echo "::error::$k missing"; ok=0; fi; done
          [ $ok = 1 ]
      - name: Which files, and where they go
        run: |
          V="${{ inputs.version }}"; [ -n "$V" ] || V=$(jq -r .version latest.json); echo "V=$V" >> $GITHUB_ENV; echo "version $V"
          mkdir f && gh release download "v$V" -R ${{ github.repository }} -D f -p "V2Fall-*.apk" -p "V2Fall-Setup-*.exe" -p "*.dmg" -p "*.deb" -p "*.tar.gz"
          ls -la f
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" "$@"; }
          A="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"
          KV=$(api "$A/storage/kv/namespaces?per_page=100" | jq -r --arg t "$KV_TITLE" '.result[]? | select(.title==$t) | .id' | head -1)
          [ -n "$KV" ] || { echo "::error::KV namespace not found"; exit 1; }
          echo "KV=$KV" >> $GITHUB_ENV
          STORE=$(api "$A/storage/kv/namespaces/$KV/values/tg:store")
          if [ "$TEST" = true ]; then CHAT=$ADMIN; echo "test: files go to the admin chat"; else
            echo "$STORE" | grep -Eq '^-?[0-9]+$' || { echo "::error::no store channel yet: forward one channel post with a file to the bot once"; exit 1; }
            CHAT=$STORE; fi
          echo "CHAT=$CHAT" >> $GITHUB_ENV
      - name: Leave the cloud Bot API, start Telegram's local Bot API server
        run: |
          curl -sS "https://api.telegram.org/bot$TOKEN/getMe" | jq -c '{ok, username: .result.username}'
          curl -sS -X POST "https://api.telegram.org/bot$TOKEN/logOut" | jq -c '{ok, description}'
          echo "OUT_AT=$(date +%s)" >> $GITHUB_ENV
          docker run -d --name tgapi -p 8081:8081 -e TELEGRAM_API_ID="$API_ID" -e TELEGRAM_API_HASH="$API_HASH" aiogram/telegram-bot-api:latest >/dev/null
          for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:8081/bot$TOKEN/getMe" >/dev/null 2>&1 && break; sleep 3; done
          curl -sS "http://127.0.0.1:8081/bot$TOKEN/getMe" | jq -c '{ok, username: .result.username}'
      - name: Upload and register
        run: |
          L="http://127.0.0.1:8081/bot$TOKEN"
          A="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/$KV/values"
          kind() { case "$1" in *-android6.apk) echo a6;; *-arm64.apk) echo arm64;; *-armv7.apk) echo armv7;; V2Fall-[0-9]*.apk) echo apk;; *.exe) echo win;; *Apple-Silicon.dmg) echo macarm;; *Intel.dmg) echo macintel;; *.deb) echo deb;; *.tar.gz) echo tar;; esac; }
          files=$(ls f); [ "$TEST" = true ] && files=$(ls f | grep -m1 '\.exe$')
          sent=""; failed=""
          for fn in $files; do
            k=$(kind "$fn"); [ -n "$k" ] || continue
            R=$(curl -sS -m 900 -F chat_id="$CHAT" -F document=@"f/$fn" -F caption="V2Fall $V — $fn" "$L/sendDocument")
            id=$(echo "$R" | jq -r '.result.message_id // empty')
            if [ -z "$id" ]; then echo "::warning::$fn: $(echo "$R" | jq -c '{ok, description}')"; failed="$failed $fn"; continue; fi
            echo "sent $fn ($k) → message $id"; sent="$sent $fn"
            if [ "$TEST" != true ]; then
              ref=$(jq -cn --argjson c "$CHAT" --argjson i "$id" '{chat:$c,id:$i}')
              curl -sS -X PUT -H "Authorization: Bearer $CF_TOKEN" "$A/tg:f:$k" --data "$ref" | jq -c '{success}'
              [ "$k" = apk ] && curl -sS -X PUT -H "Authorization: Bearer $CF_TOKEN" "$A/tg:apk" --data "$ref" | jq -c '{success}'
            fi
          done
          echo "SENT=$sent" >> $GITHUB_ENV; echo "FAILED=$failed" >> $GITHUB_ENV
          [ -n "$sent" ]
      - name: Back to the cloud Bot API (always)
        if: always()
        run: |
          [ -n "$OUT_AT" ] || exit 0
          curl -sS -X POST "http://127.0.0.1:8081/bot$TOKEN/logOut" >/dev/null 2>&1 || true
          docker rm -f tgapi >/dev/null 2>&1 || true
          left=$(( OUT_AT + 630 - $(date +%s) )); [ $left -gt 0 ] && { echo "waiting ${left}s (Telegram's 10 minutes after logOut)"; sleep $left; }
          B="https://api.telegram.org/bot$TOKEN"; SEC=$(printf %s "v2fall-tg:$TOKEN" | sha256sum | cut -c1-32)
          for i in 1 2 3 4 5 6; do
            R=$(curl -sS -X POST "$B/setWebhook" -d "url=https://$DOMAIN/tg" -d "secret_token=$SEC" -d 'allowed_updates=["message","callback_query","channel_post"]' -d "drop_pending_updates=false")
            echo "$R" | jq -c '{ok, description}'; echo "$R" | jq -e .ok >/dev/null && break; sleep 60
          done
          curl -sS "$B/getWebhookInfo" | jq -c '.result | {url, pending_update_count, last_error_message}'
          msg="📦 V2Fall $V — $([ "$TEST" = true ] && echo 'تست' || echo 'فایل‌ها ثبت شد'):$SENT$([ -n "$FAILED" ] && echo " — ناموفق:$FAILED")"
          curl -sS -X POST "$B/sendMessage" -d chat_id="$ADMIN" --data-urlencode text="$msg" | jq -c '{ok}'

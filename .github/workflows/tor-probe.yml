name: Tor bundle probe
# what is inside the Tor Project's expert bundles (file names and kinds), to package Tor as a helper
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Tor Browser version of the expert bundle', default: '15.0.5' }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          V="${{ inputs.version }}"
          for P in android-aarch64 android-armv7 windows-x86_64 linux-x86_64 macos-aarch64; do
            F="tor-expert-bundle-$P-$V.tar.gz"; ok=""
            for B in "https://archive.torproject.org/tor-package-archive/torbrowser/$V" "https://dist.torproject.org/torbrowser/$V"; do
              curl -fsSL -o "$F" "$B/$F" && { ok="$B"; break; }
            done
            echo "===== $P from ${ok:-NOWHERE}"; [ -n "$ok" ] || continue
            mkdir -p "x-$P" && tar xzf "$F" -C "x-$P" && (cd "x-$P" && find . -type f | sort | while read f; do echo "$f | $(file -b "$f" | cut -c1-110)"; done)
            [ -f "x-$P/tor/pluggable_transports/pt_config.json" ] && python3 -c "import json;j=json.load(open('x-$P/tor/pluggable_transports/pt_config.json'));print('PT:',j.get('pluggableTransports'));print('BRIDGES:',{k:len(v) for k,v in j.get('bridges',{}).items()})"
          done
          curl -fsSL "https://archive.torproject.org/tor-package-archive/torbrowser/$V/sha256sums-signed-build.txt" | grep expert | head -8

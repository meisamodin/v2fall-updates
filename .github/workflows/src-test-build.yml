# Builds the private source (meisamodin/v2fall) here because Actions are free for public repos.
# Only finished binaries are attached to DRAFT releases (visible to the owner only); no source is uploaded.
# Generated from the source repo's workflow — regenerate when that changes.
name: Build experimental (source)

# Branch test builds. Jobs hand files to each other through a DRAFT release (release assets
# do not count against the 0.5 GB Actions storage quota; artifacts and per-run caches did and
# filled it, which left runs queued). Only the shared libbox cache from main is still used.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of meisamodin/v2fall to build"
        default: "v18.8-fixes"

permissions:
  contents: write

env:
  SING_BOX_VERSION: "1.14.4"
  XRAY_VERSION: "26.9.9"
  APP_VERSION: "18.9.43"
  DNSTT_VERSION: "1.20260501.0"
  MIERU_VERSION: "3.39.0"
  MDV_SHA: "4052a6b95e758adf2dc26fa1fe527457e58d627c" # masterking32/MasterDnsVPN — fast DNS tunnel
  TAG: test-v18.8-${{ github.run_number }}
  WARP_VERSION: "1.2.6"
  USQUE_VERSION: "4.2.1" # Diniboy1123/usque — WARP over MASQUE

jobs:
  prep:
    name: Prepare web + dnstt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: meisamodin/v2fall
          ref: ${{ inputs.ref || 'v18.8-fixes' }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Check generated configs with the real cores
        run: |
          set -e
          pip install --quiet playwright
          mkdir -p /tmp/cores && cd /tmp/cores
          curl -fsSL -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" && unzip -q -o x.zip xray
          curl -fsSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" && tar xzf sb.tgz
          cd "$GITHUB_WORKSPACE"
          python3 tools/config-check/check.py web/index.html /tmp/cores/xray /tmp/cores/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box "$(command -v google-chrome || command -v chromium)"

      - name: Protect web UI
        run: |
          set -e
          mkdir -p /tmp/obf webp && cd /tmp/obf && npm init -y >/dev/null && npm install --silent javascript-obfuscator@4.1.1
          # the version the app compares with latest.json comes from the build, never from a hand-edited line:
          # a stale one made every installed copy offer the same update again and again
          cd "$GITHUB_WORKSPACE" && sed -i "s/^const APP_VERSION = '[^']*';/const APP_VERSION = '${APP_VERSION}';/" web/index.html && grep -q "^const APP_VERSION = '${APP_VERSION}';" web/index.html || { echo "::error::APP_VERSION not set in web/index.html"; exit 1; }
          cd "$GITHUB_WORKSPACE" && NODE_PATH=/tmp/obf/node_modules node tools/protect-web.cjs web/index.html webp/index.html
          grep -q "function v2fBack(" webp/index.html

      - name: Build dnstt-client (android + windows)
        run: |
          set -e
          mkdir -p dn && cd dn && go mod init dnsttbuild >/dev/null
          go get www.bamsoftware.com/git/dnstt.git/dnstt-client@v${DNSTT_VERSION}
          P=www.bamsoftware.com/git/dnstt.git/dnstt-client
          b() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 GOARM=7 go build -trimpath -ldflags "-s -w -buildid=" -o "../out/$3" $P; }
          b linux arm64 android-arm64/libdnstt.so
          b linux arm android-arm/libdnstt.so
          b windows amd64 windows/dnstt-client.exe
          cd ..
          curl -fsSL -o m.tgz "https://codeload.github.com/enfein/mieru/tar.gz/refs/tags/v${MIERU_VERSION}"
          tar xzf m.tgz && mv "mieru-${MIERU_VERSION}" msrc && cd msrc
          m() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 GOARM=7 go build -trimpath -ldflags "-s -w -buildid=" -o "../out/$3" ./cmd/mieru; }
          # static linux binaries run fine on Android (same as dnstt); GOOS=android needs the NDK
          m linux arm64 android-arm64/libmieru.so
          m linux arm android-arm/libmieru.so
          m windows amd64 windows/mieru.exe
          cd ..
          curl -fsSL -o w.tgz "https://codeload.github.com/bepass-org/warp-plus/tar.gz/refs/tags/v${WARP_VERSION}"
          tar xzf w.tgz && mv "warp-plus-${WARP_VERSION}" wsrc && cd wsrc
          # Go 1.22: newer Go makes psiphon-tls panic at start-up (WARP/Psiphon dead in every mode)
          w() { GOTOOLCHAIN=go1.22.10 CGO_ENABLED=0 GOOS=$1 GOARCH=$2 GOARM=7 go build -trimpath $4 -ldflags "-s -w -buildid=" -o "../out/$3" ./cmd/warp-plus; }
          # static linux binaries run on Android; the v2fandroid tag turns off what Android forbids (sticky
          # sockets / netlink) and gives the helper a DNS resolver (tools/helpers/android-patch.sh)
          bash "$GITHUB_WORKSPACE/tools/helpers/android-patch.sh" "$PWD" cmd/warp-plus warp
          w linux arm64 android-arm64/libwarp.so -tags=v2fandroid
          w linux arm android-arm/libwarp.so -tags=v2fandroid
          w windows amd64 windows/warp-plus.exe
          # WARP over MASQUE helper (needs the Go version its go.mod asks for)
          (curl -fsSL -o ../u.tgz "https://codeload.github.com/Diniboy1123/usque/tar.gz/refs/tags/v${USQUE_VERSION}" && cd .. && tar xzf u.tgz && cd "usque-${USQUE_VERSION}" && \
            bash "$GITHUB_WORKSPACE/tools/helpers/android-patch.sh" "$PWD" . && \
            for t in "linux arm64 android-arm64/libusque.so -tags=v2fandroid" "linux arm android-arm/libusque.so -tags=v2fandroid" "windows amd64 windows/usque.exe"; do set -- $t; GOTOOLCHAIN=auto CGO_ENABLED=0 GOOS=$1 GOARCH=$2 GOARM=7 go build -trimpath ${4:-} -ldflags "-s -w -buildid=" -o "$GITHUB_WORKSPACE/out/$3" . || exit 1; done)
          cd "$GITHUB_WORKSPACE/tools/awg" && go mod tidy
          a() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 GOARM=7 go build -trimpath -ldflags "-s -w -buildid=" -o "$GITHUB_WORKSPACE/out/$3" .; }
          # static linux binaries run fine on Android (same as the other helpers); GOOS=android needs the NDK
          a linux arm64 android-arm64/libawg.so
          a linux arm android-arm/libawg.so
          a windows amd64 windows/awg.exe
          ls -laR "$GITHUB_WORKSPACE/out"
          # start-up check: a helper that panics at start-up fails silently on users' phones
          mkdir -p /tmp/sm
          (cd "$GITHUB_WORKSPACE/../wsrc" 2>/dev/null || cd "$GITHUB_WORKSPACE/wsrc"; GOTOOLCHAIN=go1.22.10 CGO_ENABLED=0 go build -o /tmp/sm/warp-plus ./cmd/warp-plus)
          (cd "$GITHUB_WORKSPACE/usque-${USQUE_VERSION}" 2>/dev/null || cd "$GITHUB_WORKSPACE/../usque-${USQUE_VERSION}"; GOTOOLCHAIN=auto CGO_ENABLED=0 go build -o /tmp/sm/usque .)
          (cd "$GITHUB_WORKSPACE/tools/awg" && CGO_ENABLED=0 go build -o /tmp/sm/awg .)
          smoke() { local out; out=$(timeout 8 "$@" 2>&1 || true); if printf '%s' "$out" | grep -qE "panic:|fatal error:|SIGSEGV|SIGILL"; then echo "::error::$(basename "$1") crashes at start-up"; printf '%s\n' "$out" | head -20; return 1; fi; echo "ok: $(basename "$1")"; }
          smoke /tmp/sm/warp-plus --help
          smoke /tmp/sm/usque --help
          # the Android builds (v2fandroid tag) on this machine with no /etc/resolv.conf, like a phone:
          # they must start, and usque must still resolve Cloudflare's API and register an account
          (cd "$GITHUB_WORKSPACE/../wsrc" 2>/dev/null || cd "$GITHUB_WORKSPACE/wsrc"; GOTOOLCHAIN=go1.22.10 CGO_ENABLED=0 go build -tags=v2fandroid -o /tmp/sm/warp-plus-a ./cmd/warp-plus)
          (cd "$GITHUB_WORKSPACE/usque-${USQUE_VERSION}" 2>/dev/null || cd "$GITHUB_WORKSPACE/../usque-${USQUE_VERSION}"; GOTOOLCHAIN=auto CGO_ENABLED=0 go build -tags=v2fandroid -o /tmp/sm/usque-a .)
          smoke /tmp/sm/warp-plus-a --help
          sudo mv /etc/resolv.conf /etc/resolv.conf.v2f
          reg=$(timeout 45 /tmp/sm/usque-a register -a -c /tmp/sm/masque.json 2>&1 || true)
          sudo mv /etc/resolv.conf.v2f /etc/resolv.conf
          if [ ! -s /tmp/sm/masque.json ]; then echo "::error::MASQUE helper cannot register without /etc/resolv.conf"; echo "$reg" | tail -8; exit 1; fi
          echo "ok: usque registers without a system resolver"
          smoke /tmp/sm/awg -h
          # MasterDnsVPN: client helper for Android/Windows + its server for the setup script,
          # then an end-to-end check: our server script (test mode) and the exact client config the app writes,
          # real traffic through a DNS tunnel on this machine
          (cd "$GITHUB_WORKSPACE/.." && curl -fsSL -o mdv.tgz "https://codeload.github.com/masterking32/MasterDnsVPN/tar.gz/$MDV_SHA" && tar xzf mdv.tgz && mv "MasterDnsVPN-$MDV_SHA" mdvsrc && cd mdvsrc && \
            for t in "linux arm64 android-arm64/libmdv.so" "linux arm android-arm/libmdv.so" "windows amd64 windows/mdv-client.exe"; do set -- $t; GOTOOLCHAIN=auto CGO_ENABLED=0 GOOS=$1 GOARCH=$2 GOARM=7 go build -trimpath -ldflags "-s -w -buildid=" -o "$GITHUB_WORKSPACE/out/$3" ./cmd/client || exit 1; done && \
            mkdir -p "$GITHUB_WORKSPACE/out/srv" && for a in amd64 arm64; do GOTOOLCHAIN=auto CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags "-s -w -buildid=" -o "$GITHUB_WORKSPACE/out/srv/mdv-server-linux-$a" ./cmd/server || exit 1; done && \
            GOTOOLCHAIN=auto CGO_ENABLED=0 go build -o /tmp/sm/mdv-client ./cmd/client)
          smoke /tmp/sm/mdv-client -version
          sudo mkdir -p /usr/local/v2fall-mdv && sudo chown "$(id -u)" /usr/local/v2fall-mdv
          V2F_TEST=1 MDV_BIN="$GITHUB_WORKSPACE/out/srv/mdv-server-linux-amd64" MDV_HOST=127.0.0.1 MDV_PORT=15353 bash "$GITHUB_WORKSPACE/server/v2fall-mdv.sh" t.lab.test
          KEY=$(tr -d '[:space:]' < /usr/local/v2fall-mdv/encrypt_key.txt)
          mkdir -p /tmp/mdvc
          printf 'DOMAINS = ["t.lab.test"]\nDATA_ENCRYPTION_METHOD = 2\nENCRYPTION_KEY = "%s"\nPROTOCOL_TYPE = "SOCKS5"\nLISTEN_IP = "127.0.0.1"\nLISTEN_PORT = 18555\nSOCKS5_AUTH = false\nLOCAL_DNS_ENABLED = false\nLOCAL_DNS_CACHE_PERSIST_TO_FILE = false\nSAVE_MTU_SERVERS_TO_FILE = false\n' "$KEY" > /tmp/mdvc/client_config.toml
          echo "127.0.0.1:15353" > /tmp/mdvc/client_resolvers.txt
          (cd /tmp/mdvc && nohup /tmp/sm/mdv-client -config /tmp/mdvc/client_config.toml > /tmp/mdvc/client.log 2>&1 &)
          ok=""; for i in $(seq 1 45); do code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --socks5-hostname 127.0.0.1:18555 https://www.gstatic.com/generate_204 || true); [ "$code" = 204 ] && { ok=1; break; }; sleep 2; done
          if [ -z "$ok" ]; then echo "::error::MasterDnsVPN end-to-end failed"; tail -40 /tmp/mdvc/client.log; tail -40 /usr/local/v2fall-mdv/server.log; exit 1; fi
          echo "ok: MasterDnsVPN carries real traffic"
          curl -s -o /dev/null -w "1 MB through the DNS tunnel: %{http_code} %{size_download} bytes in %{time_total}s\n" --max-time 90 --socks5-hostname 127.0.0.1:18555 "https://speed.cloudflare.com/__down?bytes=1048576" || true
          pkill -f mdv-client || true; pkill -f mdv-server || true

      # «اینترنت برای ایران»: the broker's real code (functions/rb) from this repo, run locally on node:sqlite
      - uses: actions/checkout@v4
        with:
          path: upd
          sparse-checkout: cloudflare
          persist-credentials: false
      - name: Build v2f-relay + end-to-end and safety-filter tests
        env:
          GOTOOLCHAIN: auto
        run: bash tools/v2f-relay/ci.sh out upd/cloudflare

      - name: Create the draft release and hand the prepared files over
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tar czf prep.tgz webp out
          gh release create "$TAG" prep.tgz out/srv/* --repo "${{ github.repository }}" --draft \
            --target "${{ github.ref_name }}" --title "V2Fall ${{ env.APP_VERSION }} TEST BUILD" \
            --notes "ساخت آزمایشی برنچ v18.8-fixes — برای تست، نه انتشار."

  lab:
    name: Config lab (every link type through the real cores)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: meisamodin/v2fall
          ref: ${{ inputs.ref || 'v18.8-fixes' }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            tools/lab
            web
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run
        run: |
          cd tools/lab && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          bash run-lab.sh

  android:
    name: Android APK
    needs: [prep, lab]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: meisamodin/v2fall
          ref: ${{ inputs.ref || 'v18.8-fixes' }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - name: Get the prepared files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "${{ github.repository }}" -p prep.tgz && tar xzf prep.tgz && rm prep.tgz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore libbox from cache
        id: libbox
        uses: actions/cache@v4
        with:
          path: libbox.aar
          key: libbox-${{ env.SING_BOX_VERSION }}-arm-arm64-v2

      # the cache can be evicted or deleted by hand: then build libbox here (same as build.yml)
      - name: Checkout sing-box
        if: steps.libbox.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v${{ env.SING_BOX_VERSION }}
          path: sing-box

      - uses: actions/setup-go@v5
        if: steps.libbox.outputs.cache-hit != 'true'
        with:
          go-version-file: sing-box/go.mod
          cache: false

      - name: Build libbox.aar
        if: steps.libbox.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export PATH="$PATH:$(go env GOPATH)/bin"
          TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0,with_tailscale,ts_omit_logtail,ts_omit_ssh,ts_omit_drive,ts_omit_taildrop,ts_omit_webclient,ts_omit_doctor,ts_omit_capture,ts_omit_kube,ts_omit_aws,ts_omit_synology,ts_omit_bird"
          LDFLAGS="-X github.com/sagernet/sing-box/constant.Version=${SING_BOX_VERSION} -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid="
          gomobile bind -v -o ../libbox.aar -target android/arm64,android/arm -androidapi 24 \
            -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false \
            -ldflags "$LDFLAGS" -tags "$TAGS" ./experimental/libbox
          cd .. && rm -rf sing-box

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bundle Xray core
        run: |
          set -e
          mkdir -p android/app/libs && cp libbox.aar android/app/libs/
          for pair in "arm64-v8a:Xray-android-arm64-v8a.zip" "armeabi-v7a:Xray-linux-arm32-v7a.zip"; do
            abi=${pair%%:*}; zipname=${pair#*:}
            curl -fsSL -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/${zipname}"
            rm -rf xr && mkdir xr && unzip -q x.zip -d xr
            mkdir -p android/app/src/main/jniLibs/$abi
            cp xr/xray android/app/src/main/jniLibs/$abi/libxray.so
            chmod +x android/app/src/main/jniLibs/$abi/libxray.so
          done
          cp out/android-arm64/libdnstt.so android/app/src/main/jniLibs/arm64-v8a/libdnstt.so
          cp out/android-arm/libdnstt.so android/app/src/main/jniLibs/armeabi-v7a/libdnstt.so
          cp out/android-arm64/libmieru.so android/app/src/main/jniLibs/arm64-v8a/libmieru.so
          cp out/android-arm/libmieru.so android/app/src/main/jniLibs/armeabi-v7a/libmieru.so
          cp out/android-arm64/libwarp.so android/app/src/main/jniLibs/arm64-v8a/libwarp.so
          cp out/android-arm/libwarp.so android/app/src/main/jniLibs/armeabi-v7a/libwarp.so
          cp out/android-arm64/libawg.so android/app/src/main/jniLibs/arm64-v8a/libawg.so
          cp out/android-arm/libawg.so android/app/src/main/jniLibs/armeabi-v7a/libawg.so
          cp out/android-arm64/libusque.so android/app/src/main/jniLibs/arm64-v8a/libusque.so
          cp out/android-arm/libusque.so android/app/src/main/jniLibs/armeabi-v7a/libusque.so
          cp out/android-arm64/libmdv.so android/app/src/main/jniLibs/arm64-v8a/libmdv.so
          cp out/android-arm/libmdv.so android/app/src/main/jniLibs/armeabi-v7a/libmdv.so
          cp out/android-arm64/libv2frelay.so android/app/src/main/jniLibs/arm64-v8a/libv2frelay.so
          cp out/android-arm/libv2frelay.so android/app/src/main/jniLibs/armeabi-v7a/libv2frelay.so
          chmod +x android/app/src/main/jniLibs/*/libdnstt.so android/app/src/main/jniLibs/*/libmieru.so android/app/src/main/jniLibs/*/libwarp.so android/app/src/main/jniLibs/*/libawg.so android/app/src/main/jniLibs/*/libusque.so android/app/src/main/jniLibs/*/libmdv.so android/app/src/main/jniLibs/*/libv2frelay.so
          ls -la android/app/src/main/jniLibs/*/

      - name: Bundle font
        run: |
          mkdir -p android/app/src/main/assets/fonts
          npm pack vazirmatn@33.0.3 --silent && tar xzf vazirmatn-33.0.3.tgz
          F=$(find package -iname "*.woff2" | grep -iE "wght|variable" | grep -viE "ui|fd|round|nl|misc" | head -1)
          echo "font: $F"; [ -n "$F" ] && cp "$F" android/app/src/main/assets/fonts/Vazirmatn-Variable.woff2 || echo "::warning::font not bundled, using system font"

      - name: Build APK
        env:
          V2F_VERSION_NAME: ${{ env.APP_VERSION }}
        run: |
          mkdir -p android/app/src/main/assets
          cp webp/index.html android/app/src/main/assets/index.html
          # monotonic across workflows: minutes since epoch (+1) — always beats every earlier build,
          # including same-hour rebuilds (hours-based codes tied when two rcs shipped within one hour)
          export V2F_VERSION_CODE=$(( $(date -u +%s) / 60 + 1 ))
          gradle -p android assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          ls android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-universal-release-unsigned.apk dist/V2Fall-${APP_VERSION}-unsigned.apk
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk dist/V2Fall-${APP_VERSION}-arm64-unsigned.apk
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk dist/V2Fall-${APP_VERSION}-armv7-unsigned.apk

      - name: Sign APK (only if the KEYSTORE_B64 secret is set)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for v in "" -arm64 -armv7; do
            $BT/zipalign -f -p 4 dist/V2Fall-${APP_VERSION}${v}-unsigned.apk dist/aligned.apk
            $BT/apksigner sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD \
              --out dist/V2Fall-${APP_VERSION}${v}.apk dist/aligned.apk
            rm -f dist/aligned.apk dist/V2Fall-${APP_VERSION}${v}-unsigned.apk
          done
          rm -f release.p12

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber

  windows:
    name: Windows app + installer
    needs: [prep, lab]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: meisamodin/v2fall
          ref: ${{ inputs.ref || 'v18.8-fixes' }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - name: Get the prepared files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "${{ github.repository }}" -p prep.tgz && tar xzf prep.tgz && rm prep.tgz

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: desktop-app/go.mod

      - name: Prepare frontend and cores
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force desktop-app/frontend/fonts, build/win/core, dist | Out-Null
          Copy-Item webp/index.html desktop-app/frontend/index.html
          npm pack vazirmatn@33.0.3 --silent; tar xzf vazirmatn-33.0.3.tgz
          $f = Get-ChildItem package -Recurse -Filter *.woff2 | Where-Object { $_.Name -match 'wght|ariable' -and $_.Name -notmatch 'UI|FD|Round|NL' } | Select-Object -First 1
          if ($f) { Copy-Item $f.FullName desktop-app/frontend/fonts/Vazirmatn-Variable.woff2 }
          try { npm pack country-flag-emoji-polyfill --silent; New-Item -ItemType Directory -Force cf | Out-Null; tar xzf (Get-ChildItem country-flag-emoji-polyfill-*.tgz).FullName -C cf
                $ff = Get-ChildItem cf -Recurse -Filter *.woff2 | Select-Object -First 1; if ($ff) { Copy-Item $ff.FullName desktop-app/frontend/fonts/TwemojiCountryFlags.woff2 } else { Write-Host "::warning::flag font not found" } } catch { Write-Host "::warning::flag font not bundled" }
          $sb = "sing-box-$env:SING_BOX_VERSION-windows-amd64"
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$env:SING_BOX_VERSION/$sb.zip" -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sb
          Copy-Item "sb/$sb/sing-box.exe" build/win/core/v2fall-core.exe
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/v$env:XRAY_VERSION/Xray-windows-64.zip" -OutFile xr.zip
          Expand-Archive xr.zip -DestinationPath xr
          Copy-Item xr/xray.exe build/win/core/xray.exe
          Copy-Item out/windows/dnstt-client.exe build/win/core/dnstt-client.exe
          Copy-Item out/windows/mieru.exe build/win/core/mieru.exe
          Copy-Item out/windows/warp-plus.exe build/win/core/warp-plus.exe
          Copy-Item out/windows/usque.exe build/win/core/usque.exe
          Copy-Item out/windows/mdv-client.exe build/win/core/mdv-client.exe
          Copy-Item out/windows/v2f-relay.exe build/win/core/v2f-relay.exe
          Copy-Item out/windows/awg.exe build/win/core/awg.exe

      - name: Build V2Fall.exe (Wails v3)
        shell: pwsh
        working-directory: desktop-app
        run: |
          $ErrorActionPreference = 'Stop'
          go install github.com/tc-hib/go-winres@v0.3.3
          $v = "$env:APP_VERSION.0.0"
          & "$(go env GOPATH)/bin/go-winres" simply --icon ../assets/appIcon.png --manifest gui --admin --product-name V2Fall --file-description V2Fall --product-version $v --file-version $v --copyright "odin"
          go mod tidy
          go build -tags production -trimpath -ldflags "-s -w -H windowsgui -X main.AppVersion=$env:APP_VERSION" -o ../build/win/V2Fall.exe .

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVer=$env:APP_VERSION" "/DSrcDir=..\build\win" desktop/installer.iss
          Compress-Archive -Path build/win/* -DestinationPath "dist/V2Fall-$env:APP_VERSION-Windows-x64-portable.zip"

      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber

  cleanup:
    name: Remove the handoff file
    needs: [android, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset "$TAG" prep.tgz --repo "${{ github.repository }}" -y || true

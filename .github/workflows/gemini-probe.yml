name: Gemini via WARP probe
# Does Gemini accept Cloudflare WARP? From this runner, gemini.google.com is fetched directly and through a free
# WARP account (sing-box WireGuard endpoint), and the page is checked for Google's "not supported in your country".
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Tools
        run: |
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz | tar xz
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 && chmod +x wgcf
          ./wgcf register --accept-tos >/dev/null && ./wgcf generate >/dev/null
          grep -E '^(Address|PublicKey|Endpoint)' wgcf-profile.conf
      - name: Probe
        run: |
          pk=$(sed -n 's/^PrivateKey = //p' wgcf-profile.conf); pub=$(sed -n 's/^PublicKey = //p' wgcf-profile.conf)
          a4=$(sed -n 's/^Address = \([0-9.]*\/32\).*/\1/p' wgcf-profile.conf | head -1); [ -n "$a4" ] || a4=$(grep -o '[0-9.]*/32' wgcf-profile.conf | head -1)
          cat > c.json <<EOF
          {"log":{"level":"warn"},"inbounds":[{"type":"mixed","listen":"127.0.0.1","listen_port":2080}],
           "endpoints":[{"type":"wireguard","tag":"warp","address":["$a4"],"private_key":"$pk","mtu":1280,
             "peers":[{"address":"162.159.192.1","port":2408,"public_key":"$pub","allowed_ips":["0.0.0.0/0"]}]}],
           "route":{"final":"warp"}}
          EOF
          ./sing-box-1.14.4-linux-amd64/sing-box run -c c.json & sleep 4
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          for via in direct warp; do
            X=""; [ $via = warp ] && X="-x socks5h://127.0.0.1:2080"
            echo "== $via"; curl -s $X -m 20 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)='
            curl -s $X -m 25 -A "$UA" -H 'Accept-Language: en-US,en;q=0.9' https://gemini.google.com/app -o g-$via.html -w 'gemini http %{http_code} → %{url_effective}\n' -L
            if grep -qiE "isn.t (currently )?supported in your country|not available in your country|country isn.t supported" g-$via.html; then echo "GEMINI: NOT SUPPORTED"; else echo "GEMINI: no refusal text ($(wc -c < g-$via.html) bytes)"; fi
            grep -oiE "unsupported[^\"<]{0,60}" g-$via.html | head -2
          done

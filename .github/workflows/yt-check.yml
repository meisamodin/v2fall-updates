name: YouTube status
# Is an uploaded video public? An unaudited API project's uploads stay locked to private, which shows as
# "not public" here. Uses YouTube's public oEmbed page (no sign-in), so it sees exactly what visitors see.
on:
  workflow_dispatch:
    inputs:
      ids: { description: 'video ids, comma-separated', required: true, default: 'M9LSpDEgOZM' }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env: { IDS: "${{ inputs.ids }}" }
        run: |
          for v in $(echo "$IDS" | tr ',' ' '); do
            echo "$v" | grep -Eq '^[A-Za-z0-9_-]{11}$' || { echo "bad id $v"; continue; }
            c=$(curl -s -o /tmp/o.json -w '%{http_code}' "https://www.youtube.com/oembed?format=json&url=https://www.youtube.com/watch?v=$v")
            if [ "$c" = 200 ]; then echo "$v PUBLIC: $(jq -r .title /tmp/o.json)"; else echo "$v NOT PUBLIC (http $c)"; fi | tee -a "$GITHUB_STEP_SUMMARY"
          done

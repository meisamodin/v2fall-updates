name: Refresh CDN cache
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr cache for the stable and experimental manifests
        run: |
          # a stale experimental manifest made users step through older builds one by one
          for f in latest.json experimental/latest.json; do
            for i in 1 2 3; do
              curl -fsS "https://purge.jsdelivr.net/gh/meisamodin/v2fall-updates@main/$f" && break
              sleep 20
            done
          done

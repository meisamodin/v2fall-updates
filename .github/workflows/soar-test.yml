name: Soar helper test
# builds v2f-soar from the app repo and runs it end to end against a real soar-server
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "app branch"
        default: next
env:
  SOAR_VERSION: "0.2.5"
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: meisamodin/v2fall
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
          sparse-checkout: tools/soar
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Build
        run: |
          set -e
          cd tools/soar && go mod tidy && CGO_ENABLED=0 go build -trimpath -o /tmp/v2f-soar . && go vet . && cd -
          GOBIN=/tmp go install github.com/getlantern/soar/cmd/soar-server@v${SOAR_VERSION}
          for t in linux/arm64 linux/arm windows/amd64 darwin/arm64; do GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 CGO_ENABLED=0 go build -C tools/soar -trimpath -o /dev/null . && echo "builds for $t"; done
      - name: End to end
        run: bash tools/soar/e2e.sh /tmp/v2f-soar /tmp/soar-server

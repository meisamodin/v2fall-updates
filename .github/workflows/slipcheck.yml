# temporary: can slipstream-rust (Apache-2.0) be built for Android?
name: Slipstream Android build (try)
on: push
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-linux-android, abi: arm64-v8a }
          - { target: armv7-linux-androideabi, abi: armeabi-v7a }
    steps:
      - name: Source (pinned)
        run: |
          git clone -q https://github.com/Mygod/slipstream-rust.git src && cd src && git checkout -q 7de506b222c83ae97a19a618e33fe26899af1bd5 && git submodule update --init --recursive -q
      - run: rustup target add ${{ matrix.target }} && cargo install cargo-ndk --locked -q
      - name: OpenSSL for Android (static)
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME PATH=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          curl -sSL https://github.com/openssl/openssl/releases/download/openssl-3.0.15/openssl-3.0.15.tar.gz | tar xz
          cd openssl-3.0.15
          T=${{ matrix.abi == 'arm64-v8a' && 'android-arm64' || 'android-arm' }}
          ./Configure $T -D__ANDROID_API__=23 no-shared no-tests no-docs --prefix=$HOME/ossl --libdir=lib >/dev/null
          make -j4 build_libs >/dev/null && make install_dev >/dev/null
          ls $HOME/ossl/lib
      - name: Build
        working-directory: src
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_PLATFORM: android-23
          PICOQUIC_ANDROID: "1"
          CARGO_FEATURE_PICOQUIC_MINIMAL_BUILD: "1"
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export OPENSSL_DIR=$HOME/ossl OPENSSL_ROOT_DIR=$HOME/ossl OPENSSL_INCLUDE_DIR=$HOME/ossl/include OPENSSL_STATIC=1
          export OPENSSL_CRYPTO_LIBRARY=$HOME/ossl/lib/libcrypto.a OPENSSL_SSL_LIBRARY=$HOME/ossl/lib/libssl.a OPENSSL_LIB_DIR=$HOME/ossl/lib
          cargo ndk -t ${{ matrix.abi }} -P 23 build --release -p slipstream-client --features openssl-static 2>&1 | tail -40
          f=target/${{ matrix.target }}/release/slipstream-client; ls -la $f && file $f
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d $f | grep NEEDED

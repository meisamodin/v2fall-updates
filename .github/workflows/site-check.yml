name: Check website
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and open the site
        run: |
          set -x
          curl -sSI https://v2fall.com/ | head -20
          curl -sS https://v2fall.com/ -o i.html; wc -c i.html; grep -o 'src="[^"]*"\|href="/assets[^"]*"' i.html | head
          for u in $(grep -o '/assets/[^"]*' i.html | sort -u); do echo "$u $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' https://v2fall.com$u)"; done
          curl -sS https://v2fall.com/sw.js | head -c 600; echo
          npm i -s playwright-core@1.49.1 >/dev/null 2>&1
          cat > c.js <<'JS'
          const { chromium } = require('playwright-core');
          (async () => {
            const b = await chromium.launch({ channel: 'chrome' });
            for (const vp of [{ width: 412, height: 900 }, { width: 1280, height: 800 }]) {
              const p = await b.newPage({ viewport: vp });
              p.on('pageerror', e => console.log('PAGEERROR', e.message, (e.stack || '').split('\n').slice(0, 4).join(' | ')));
              p.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') console.log('CONSOLE', m.type(), m.text()); });
              p.on('requestfailed', r => console.log('FAILED', r.url(), r.failure() && r.failure().errorText));
              p.on('response', r => { if (r.status() >= 400) console.log('HTTP', r.status(), r.url()); });
              await p.goto('https://v2fall.com/', { waitUntil: 'networkidle', timeout: 60000 }).catch(e => console.log('GOTO', e.message));
              await p.waitForTimeout(3000);
              console.log('TEXT', vp.width, (await p.evaluate(() => document.body.innerText)).slice(0, 300).replace(/\n/g, ' / '));
              console.log('ROOT', await p.evaluate(() => (document.getElementById('root') || {}).innerHTML?.length));
            }
            await b.close();
          })();
          JS
          node c.js

name: Secrets check
# Says which secrets are set and whether the YouTube and Telegram ones work. Never prints a value.
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Which secrets are set
        env:
          S_YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          S_YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          S_YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          S_TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          S_TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          S_TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          S_TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          S_TG_API_ID: ${{ secrets.TG_API_ID }}
          S_TG_API_HASH: ${{ secrets.TG_API_HASH }}
          S_V2F_SIGN_KEY: ${{ secrets.V2F_SIGN_KEY }}
          S_V2F_SIGN_CERT: ${{ secrets.V2F_SIGN_CERT }}
          S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for v in $(env | grep -o '^S_[A-Z_0-9]*' | sort); do n=${v#S_}; val="${!v}"; if [ -n "$val" ]; then echo "SET     $n (${#val} chars)"; else echo "missing $n"; fi; done
      - name: YouTube token works
        env:
          ID: ${{ secrets.YT_CLIENT_ID }}
          SEC: ${{ secrets.YT_CLIENT_SECRET }}
          RT: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          [ -n "$RT" ] || { echo "no YouTube token"; exit 0; }
          r=$(curl -s https://oauth2.googleapis.com/token -d client_id="$ID" -d client_secret="$SEC" -d refresh_token="$RT" -d grant_type=refresh_token)
          echo "$r" | python3 -c "import json,sys;j=json.load(sys.stdin);print('YouTube: OK, scope =',j.get('scope')) if j.get('access_token') else print('YouTube: FAILED', j.get('error'), j.get('error_description'))"
          tok=$(echo "$r" | python3 -c "import json,sys;print(json.load(sys.stdin).get('access_token',''))")
          [ -n "$tok" ] && curl -s -H "Authorization: Bearer $tok" "https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true" | python3 -c "import json,sys;j=json.load(sys.stdin);it=j.get('items') or [];print('channel:', it[0]['snippet']['title'] if it else ('(token cannot read channels: '+str((j.get('error') or {}).get('message','no items'))+')'))"
      - name: Telegram bot works
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          C1: ${{ secrets.TELEGRAM_CHANNEL }}
          C2: ${{ secrets.TG_CHANNEL }}
          C3: ${{ secrets.TG_CHANNEL_ID }}
          C4: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          [ -n "$T" ] || { echo "no bot token"; exit 0; }
          curl -s "https://api.telegram.org/bot$T/getMe" | python3 -c "import json,sys;j=json.load(sys.stdin);print('bot:', '@'+j['result']['username'] if j.get('ok') else 'FAILED '+str(j.get('description')))"
          me=$(curl -s "https://api.telegram.org/bot$T/getMe" | python3 -c "import json,sys;print(json.load(sys.stdin).get('result',{}).get('id',''))")
          for c in "$C1" "$C2" "$C3" "$C4" "@v2fall"; do [ -n "$c" ] || continue
            curl -s "https://api.telegram.org/bot$T/getChatMember" --data-urlencode "chat_id=$c" -d user_id="$me" | python3 -c "
          import json,sys;j=json.load(sys.stdin);r=j.get('result') or {}
          print('channel check:', 'bot is', r.get('status'), '| can post:', r.get('can_post_messages')) if j.get('ok') else print('channel check: FAILED', j.get('description'))"
          done

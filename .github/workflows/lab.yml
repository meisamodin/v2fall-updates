name: Config lab only

# Runs just the config lab (every link type + hotspot sharing through the real cores) on a source branch,
# without building the apps — a quick check before a full build.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "source branch"
        default: "main"

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: meisamodin/v2fall
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            tools/lab
            web
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run
        run: |
          cd tools/lab && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          bash run-lab.sh
